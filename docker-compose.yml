services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      RUSTFS_ROOT_USER: rustfs-user
      RUSTFS_ROOT_PASSWORD: rustfs-password
    command: server /data --console-address ":9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  sidecar:
    build:
      context: ./sidecar-go
      dockerfile: Dockerfile
    container_name: duckdb-sidecar
    ports:
      - "8081:8081"
    environment:
      RUN_ID: local-run
      POD_NAME: docker-sidecar
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: rustfs-user
      S3_SECRET_KEY: rustfs-password
      S3_BUCKET: loadtest
      PORT: "8081"
    volumes:
      - sidecar-data:/data
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs-data:
  sidecar-data:
