apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k6-load-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k6-load
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Pods
    pods:
      metric:
        name: k6_rps
      target:
        averageValue: 1000
